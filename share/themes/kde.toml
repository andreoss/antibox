name = "kde"

[colors]
face = "#DCDCDC"
field = "#FFFFFF"
text = "#000000"
disabled = "#808080"
sel_bg = "#0A5F89"
sel_fg = "#FFFFFF"
light = "#FFFFFF"
face_light = "#EEEEEE"
button_face = "#DCDCDC"
shadow = "#B7B7B7"
dark = "#6E6E6E"
tooltip_bg = "#FFFFDC"
tooltip_fg = "#000000"
sel_line = "#0A5F89"
title_active = "#0A5F89"
title_text = "#FFFFFF"
title_inactive = "#DCDCDC"
title_text_inactive = "#000000"
title_gradient = "#09567C"
title_gradient_inactive = "#C8C8C8"
graph_bg = "#FFFFFF"
graph1 = "#0A5F89"
graph2 = "#09567C"
graph3 = "#B7B7B7"
graph4 = "#6E6E6E"

[metrics]
corner_radius = 1
pad = 4
gap = 2
item_gap = -4
title_height = 16
border = 4
border_bottom = 8
button_base = 16
button_inset = 2
title_justify = 0
sunken_depth = 1

[strings]
menu_label = "K"
title_buttons = "xmi"
taskbar_justify = "center"

[flags]
symmetric_buttons = true
flat = false
dotted_sel = false
underline_focus = false
override_chrome = true
tab_title = false
sculpted = false
outlined = true
coloured_frame = false
menu_glyph = false
title_stipple = true
title_grad_vertical = true
grad_buttons = true
equal_tabs = true

[glyphs]
minimize = [0x0000, 0x0000, 0x0000, 0x0078, 0x0078, 0x0078, 0x0078, 0x0000, 0x0000, 0x0000]
close = [0x0000, 0x0084, 0x01CE, 0x00FC, 0x0078, 0x0078, 0x00FC, 0x01CE, 0x0084, 0x0000]
maximize = [0x0000, 0x01FE, 0x01FE, 0x0186, 0x0186, 0x0186, 0x0186, 0x01FE, 0x01FE, 0x0000]
restore = [0x007F, 0x007F, 0x0063, 0x03FB, 0x03FB, 0x031F, 0x031F, 0x0318, 0x03F8, 0x03F8]

[elements.button]
ops = [
    { op = "gradient", x = "s", y = "s", w = "w-2*s", h = "h-2*s", from = "bg*1.12", to = "bg*0.93", kind = "vertical" },
    { op = "fill", x = "s", y = "s", w = "w-2*s", h = "s", colour = "bg*1.3" },
    { op = "fill", x = "s", y = "s", w = "s", h = "h-2*s", colour = "bg*1.3" },
    { op = "fill", x = "s", y = "h-2*s", w = "w-2*s", h = "s", colour = "bg*0.7" },
    { op = "fill", x = "w-2*s", y = "s", w = "s", h = "h-2*s", colour = "bg*0.7" },
    { op = "outline", x = "0", y = "0", w = "w-s", h = "h-s", colour = "bg*0.45" },
]

[elements.button_pressed]
ops = [
    { op = "gradient", x = "s", y = "s", w = "w-2*s", h = "h-2*s", from = "bg*0.88", to = "bg*1.02", kind = "vertical" },
    { op = "fill", x = "s", y = "s", w = "w-2*s", h = "s", colour = "bg*0.7" },
    { op = "fill", x = "s", y = "s", w = "s", h = "h-2*s", colour = "bg*0.7" },
    { op = "fill", x = "s", y = "h-2*s", w = "w-2*s", h = "s", colour = "bg*1.3" },
    { op = "fill", x = "w-2*s", y = "s", w = "s", h = "h-2*s", colour = "bg*1.3" },
    { op = "outline", x = "0", y = "0", w = "w-s", h = "h-s", colour = "bg*0.45" },
]

