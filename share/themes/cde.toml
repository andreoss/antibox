scrollbar_track = "#9397A5"
graph_bg = "#000000"
graph1 = "#B24D7A"
graph2 = "#DCDEE5"
graph3 = "#5D6069"
graph4 = "#FFF7E9"

[metrics]
corner_radius = 0
pad = 4
gap = 2
item_gap = 2
title_height = 19
border = 6
title_overlap = 1
border_bottom = 5
scrollbar_base = 19
button_base = 16
button_inset = 3
title_justify = 50
sunken_depth = 1

[strings]
title_buttons = "mi"
title_layout_left = "s"
title_layout_right = "mi"
taskbar_justify = "left"

[flags]
flat = false
dotted_sel = false
underline_focus = false
override_chrome = true
tab_title = false
sculpted = false
outlined = false
coloured_frame = true
menu_glyph = false
menu_text_only = true
menu_header = true
title_stipple = false
title_grad_vertical = false
grad_buttons = false
equal_tabs = false
bilevel_text = true

[glyphs]
minimize = [0x0000, 0x0000, 0x0000, 0x0078, 0x0048, 0x0048, 0x0078, 0x0000, 0x0000, 0x0000]
maximize = [0x0000, 0x01FE, 0x0102, 0x0102, 0x0102, 0x0102, 0x0102, 0x0102, 0x01FE, 0x0000]
restore = [0x0000, 0x01FE, 0x0102, 0x0102, 0x0102, 0x0102, 0x0102, 0x0102, 0x01FE, 0x0000]

[elements.button]
ops = [
    { op = "fill", x = "0", y = "0", w = "w", h = "h", colour = "face" },
    { op = "fill", x = "0", y = "0", w = "w", h = "s", colour = "light" },
    { op = "fill", x = "0", y = "0", w = "s", h = "h", colour = "light" },
    { op = "fill", x = "0", y = "h-s", w = "w", h = "s", colour = "dark" },
    { op = "fill", x = "w-s", y = "0", w = "s", h = "h", colour = "dark" },
    { op = "fill", x = "s", y = "s", w = "w-2*s", h = "s", colour = "face_light" },
    { op = "fill", x = "s", y = "s", w = "s", h = "h-2*s", colour = "face_light" },
    { op = "fill", x = "s", y = "h-2*s", w = "w-2*s", h = "s", colour = "shadow" },
    { op = "fill", x = "w-2*s", y = "s", w = "s", h = "h-2*s", colour = "shadow" },
]

[elements.button_pressed]
