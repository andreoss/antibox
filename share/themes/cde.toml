name = "cde"

[colors]
face = "#AEB2C3"
field = "#FFF7E9"
text = "#000000"
disabled = "#5D6069"
sel_bg = "#B24D7A"
sel_fg = "#FFFFFF"
menu_sel_bg = "#AEB2C3"
menu_sel_fg = "#000000"
light = "#DCDEE5"
