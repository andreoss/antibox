[theme]
name = "nt"

[font]
name = "-misc-fixed-medium-r-semicondensed--13-*-*-*-*-*-iso10646-1"

[workspace]
count = 4
layouts = "floating"

[keyboard]
layouts = ""

[cpu]
width = 40

[mem]
width = 40

[net]
width = 40
device = "*"

[clock]
format = "%H:%M:%S"

[pointer]
warp = false

[graph]
series = "000080,000080,7F7FBF,808080"
heat = "C82020"

[winlist]
position = "centre"
preview = true

[pager]
preview = true

[tabs]
position = "top"

[taskbar]
layout = "pager tasks cpu mem net power mpris keyboard tray clock"
position = "bottom"
preview = true

[omni]
preview = true

[expose]
modes = "thumbnail icon filled none"
mouse1 = "focus"
mouse2 = "close"
mouse3 = "iconify"
opacity = 150
tint = "000000"
tint_opacity = 0
highlight_opacity = 255
highlight_tint = "000000"
highlight_tint_opacity = 0
tooltip = true
tooltip_follows_mouse = true
tooltip_offset_x = 20
tooltip_offset_y = 20
tooltip_align = "left"
warp_on_show = false
warp_on_select = false
warp_on_activate = false
distance = 50
icon_size = 48
allow_upscale = false
all_desktops = true
all_monitors = true
live_thumbnails = true
show_minimized = true
show_skip_taskbar = false
include_frame = true

[ticker]
enabled = false

[keys]
"Win Win" = "Omni"
"Alt+Tab" = "FocusNext"
"Shift+Alt+Tab" = "FocusPrev"
"Alt+Esc" = "StartMenu"
"Alt+/" = "Omni"
"Alt+F4" = "Close"
"Alt+F5" = "Restore"
"Alt+F6" = "Move"
"Alt+F7" = "Move"
"Alt+F8" = "Resize"
"Alt+F9" = "Minimize"
"Alt+F10" = "Maximize"
"Alt+F11" = "Rollup"
"Alt+F12" = "Hide"
"Alt+Space" = "WindowActionMenu"
"Alt+Return" = "Exec xterm"
"Ctrl+Alt+Tab" = "FocusNext"
"Ctrl+Alt+Left" = "PrevWorkspace"
"Ctrl+Alt+Right" = "NextWorkspace"
"Shift+Ctrl+Alt+Left" = "WorkspacePrevTakeWin"
"Shift+Ctrl+Alt+Right" = "WorkspaceNextTakeWin"
"Ctrl+Alt+Up" = "WorkspaceNextTaken"
"Ctrl+Alt+Down" = "WorkspacePrevTaken"
"Ctrl+Alt+D" = "ShowDesktop"
"Ctrl+Alt+P" = "Pager"
"Super+Tab" = "Expose"
"Super+Left" = "SnapLeft"
"Super+Right" = "SnapRight"
"Super+Up" = "SnapUp"
"Super+Down" = "SnapDown"
"Super+D" = "ShowDesktop"
"Ctrl+Alt+1" = "Workspace1"
"Ctrl+Alt+2" = "Workspace2"
"Ctrl+Alt+3" = "Workspace3"
"Ctrl+Alt+4" = "Workspace4"
